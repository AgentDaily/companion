<script>
const paths={back:'m12 5-7 7 7 7',pause:'M8 5v14M16 5v14',play:'m8 5 11 7-11 7Z',today:'M4 9h16v11H4ZM8 3v4m8-4v4M4 5h16v4H4',report:'M6 3h8l4 4v14H6ZM9 11h6m-6 4h6',history:'M3 11a9 9 0 1 1 2 7M3 4v7h7m2-4v6l4 2',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2',sync:'m4 8 3-3h11m2 11-3 3H6M4 4v4h4m12 12v-4h-4',arrow:'M5 12h14m-5-5 5 5-5 5',mic:'M9 5a3 3 0 0 1 6 0v7a3 3 0 0 1-6 0ZM5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8',check:'m5 12 4 4L19 6',computer:'M3 4h18v13H3Zm9 13v4m-5 0h10',phone:'M7 2h10v20H7Zm4 17h2',app:'M4 4h6v6H4Zm10 0h6v6h-6ZM4 14h6v6H4Zm10 0h6v6h-6'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.report}"/></svg>`;
const names={A:'日记 · 时间线',B:'录音 · 控制台',C:'日报 · 行动优先'},briefs={A:['记录在进行，<br>生活在前面。','安静的全天记录。以小时为单位回看，录音状态始终可见，晚上再把一天整理成清楚的下一步。','建议方向 / 日常使用 · 低干扰'],B:['一眼确认，<br>没有错过。','强调正在录音、已记录时长与整理进度。适合你需要明确掌握采集状态、连接和处理情况的场景。','状态优先 / 采集 · 可控'],C:['一天的声音，<br>变成行动。','把总结、待办与对策放到最前面。录音缩成轻量状态条，主要用于晚间复盘和第二天的行动。','结果优先 / 复盘 · 执行']};
const url=new URL(location.href);let variant='A',device=url.searchParams.get('device')==='mac'?'mac':'phone',page=['today','report','history','settings','clips'].includes(url.searchParams.get('page'))?url.searchParams.get('page'):'today',recording=true,online=true,reportReady=false,reportTime='21:30',checked=new Set(),detail=false,toastTimer;
let savingAudio=false,keywordEnabled=false,audioOrigin='',savedClips=[],saveTimer,activeMinutes=5,audioStartedAt=0;
const config={mode:'local',baseURL:'http://127.0.0.1:11434',cloudURL:'https://example.com/v1',model:'',cloudModel:'',agent:'24r-agent',agentModel:'',provider:'inherit',keepAlive:'5m',scope:'24r',days:'30',history:true,phrases:'开始保留录音；紧急记录',minutes:'5'};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const analysisLabel=()=>config.mode==='local'?'Ollama · 本地整理':config.mode==='cloud'?'云端 Provider · 文字整理':'Quenda · '+config.agent;
function audioPanel(){return `<div class="audio-panel ${savingAudio?'retaining':''}"><div><strong>${savingAudio?'● 正在保留音频':'原始音频默认不保存'}</strong><small>${savingAudio?esc(audioOrigin)+'触发 · 最多 '+activeMinutes+' 分钟 · 仅从触发时刻开始':'日常只保存文字、小时整理与日报'}</small></div><button data-action="keep-audio">${savingAudio?'停止保存':'保留音频'}</button></div>${savedClips.length?`<div class="saved-note">${savedClips.length} 个主动保留片段 · iPhone 本地保存 <button data-action="clips">查看</button></div>`:''}`}
function stopAudio(){if(!savingAudio)return;clearTimeout(saveTimer);savingAudio=false;savedClips.push({reason:audioOrigin,seconds:Math.max(1,Math.round((Date.now()-audioStartedAt)/1000))});}
function startAudio(origin){if(savingAudio)return;if(!recording){toast('请先继续记录，再保留音频。');return}audioOrigin=origin;activeMinutes=Number(config.minutes);audioStartedAt=Date.now();savingAudio=true;saveTimer=setTimeout(()=>{stopAudio();render();toast('本次音频保留已结束（演示）')},activeMinutes*60000);render();}

const events=[['14:00—15:00','把全天记录拆成每小时整理','确定手机负责录音，电脑处理转写与整理，晚间生成一天的总结。',['2 项待办','1 个决定']],['13:00—14:00','中英文语音识别对比','对比官方 Q8 与 FP16；保留快速切换，用同一段录音检查识别效果。',['研究记录']],['11:00—12:00','梳理今天的工作重点','先完成语音识别体验，再设计 24R 的记录与日报界面。',['工作计划']]];
const capture=()=>`<div class="capture"><i class="live ${recording&&online?'':'paused'}"></i><div><strong>${!recording?'记录已暂停':online?'正在转写你的一天':'Mac 离线 · 转写暂停'}</strong><small>${!recording?'暂停期间不采集声音':online?'iPhone 麦克风 · 仅保存文字':'连接后继续 · 离线片段不补录'}</small></div><button data-action="record" aria-label="${recording?'暂停录音':'继续录音'}">${icon(recording?'pause':'play')}</button></div>${audioPanel()}`;
const sync=()=>`<div class="sync">${icon('sync')}${online?'文字与日报已保存到两端 · 刚刚同步':'Mac 离线 · 已有文字保留，离线音频不补传'}</div>`;
const teaser=()=>`<div class="reporttease" data-page="report"><div class="eyebrow">YOUR DAILY BRIEF</div><h3>${reportReady?'今天的日报已就绪':`今晚 ${reportTime}，一天会更清楚。`}</h3><div class="sub">${reportReady?'查看一日总结、待办与行动建议':'一日总结 · 待办 · 对策'}</div><span class="arrow">${icon('arrow')}</span></div>`;
const timeline=()=>`<div class="sectionhead">每小时整理 <button data-page="history">查看全部 ↗</button></div><div class="timeline"><div class="event"><span class="time">15:00—16:00 · ${recording?(online?'转写中':'等待连接'):'已暂停'}</span><h3>这一小时还在发生</h3><p>${!recording?'录音已暂停，已有内容仍会按时整理。':online?'16:00 自动整理，完成后会出现在这里。':'转写暂不可用。重新连接后继续；离线声音不会保留或补传。'}</p></div>${events.map((e,i)=>`<div class="event" data-detail="${i}"><span class="time">${e[0]} · 已整理</span><h3>${e[1]}</h3><p>${e[2]}</p><div class="chips">${e[3].map(c=>`<span class="chip">${c}</span>`).join('')}</div></div>`).join('')}</div>`;
const tasks=()=>[['完成 24R 首页设计','今天 · 来自 14:00 的记录'],['用中英混说录音对比 Q8 与 FP16','明天 · 来自 13:00 的记录'],['确定需要触发保留的关键短语','待确认 · 来自 14:00 的记录']].map((t,i)=>`<div class="task ${checked.has(i)?'done':''}"><button data-task="${i}" aria-label="${checked.has(i)?'标记为未完成：':'标记为完成：'}${t[0]}">${checked.has(i)?icon('check'):''}</button><div><span>${t[0]}</span><small>${t[1]}</small></div></div>`).join('');
function today(){return `<div class="eyebrow">SUNDAY, OCTOBER 04</div><h1 class="title serif">今天，慢慢记下来。</h1><div class="sub">2026 年 10 月 4 日 · 星期日</div>${capture()}<div class="stats"><div><strong>4<span style="font-size:13px">h</span> 32<span style="font-size:13px">m</span></strong><small>今日记录</small></div><div><strong>4</strong><small>小时已整理</small></div><div><strong>3</strong><small>待办已提取</small></div></div>${teaser()}${timeline()}${sync()}`;
}

function report(){return `<div class="eyebrow">DAILY BRIEF / 04 OCTOBER</div><h1 class="title serif">把今天，变成下一步。</h1><div class="sub">${reportReady?'今日最终日报 · 已保存到两端':`当前为阶段总结 · ${reportTime} 生成最终日报`}</div><div class="analysis-badge">${esc(analysisLabel())} · 示例分析</div><div class="paper" style="margin-top:25px"><h3>一日总结</h3><p>今天主要推进了语音识别与全天记录助手。官方 C++ 流式识别已能稳定出字，完成 Q8 与 FP16 对照；24R 的重点转向每小时整理、晚间复盘和双端保存。</p><div class="chips"><span class="chip">4 个小时的记录</span><span class="chip">3 个待办</span><span class="chip">1 个建议</span></div></div><div class="sectionhead">待办事项 <span class="pill">${3-checked.size} 项待完成</span></div>${tasks()}<div class="sectionhead">对策与建议</div><div class="strategy"><b>用实际录音，决定默认精度</b>保留 Q8 与 FP16 切换。用同一段中英混说录音比较识别错误，再判断是否值得增加内存和处理时间。<div class="chips"><span class="chip">建议，待确认</span><button class="chip" data-detail="1">查看来源 ↗</button></div></div>${config.history?`<div class="sectionhead">与过去串起来</div><div class="history-link"><span class="eyebrow">${config.mode==='quenda'?'QUENDA + 24R':'24R HISTORY'}</span><h3>继续推进「全天记录」</h3><p>前一天的记录里已提出按小时整理。今天又明确了音频默认不保存，下一步可以一起验证离线与触发保留的体验。</p><button data-action="history-source">查看 10 月 3 日的来源 ↗</button><small>示例关联 · 实际检索仅使用已选范围</small></div>`:''}<button class="primary" data-action="generate">${icon('report')}${reportReady?'重新生成日报':'现在生成最终日报'}</button>${sync()}`}
function historyPage(){return `<div class="eyebrow">YOUR DAYS</div><h1 class="title serif">每一天，都有迹可循。</h1><div class="sub" style="margin-bottom:25px">日报与小时记录 · 两端均可查看</div>${['10 月 4 日 · 今天','10 月 3 日 · 星期六','10 月 2 日 · 星期五'].map((d,i)=>`<button class="historyday" data-history="${i}"><div class="eyebrow">${d}</div><h3>${['从语音识别，走向全天记录','留出时间，完成一件重要的事','把想法整理成可以开始的计划'][i]}</h3><p>${i?'最终日报 · 7 小时记录 · 4 项待办':'今日进行中 · 4 小时已整理 · 3 项待办'}</p><div class="chips"><span class="chip">iPhone 已保存</span><span class="chip">Mac 已保存</span></div></button>`).join('')}`}
function field(label,key,value,placeholder='',type='text'){return `<label class="field"><span>${label}</span><input type="${type}" data-config="${key}" value="${esc(value)}" placeholder="${esc(placeholder)}"></label>`}
function options(key,values){return `<select aria-label="${key}" data-config="${key}">${values.map(([v,n])=>`<option value="${v}" ${config[key]===v?'selected':''}>${n}</option>`).join('')}</select>`}
function modelSettings(){let body='';
if(config.mode==='local')body=`${field('Ollama 服务地址','baseURL',config.baseURL)}<p class="fieldhint">由配对的 Mac 访问此地址；127.0.0.1 指 Mac 本机。</p>${field('模型','model',config.model,'选择已安装模型，或填写模型名')}<div class="buttonrow"><button data-action="list-models">读取模型列表</button><button data-action="test-model">测试连接</button></div><div class="row"><div>模型驻留<small>每小时整理时按需加载</small></div>${options('keepAlive',[['0','完成即卸载'],['5m','空闲 5 分钟卸载'],['30m','空闲 30 分钟卸载'],['-1','保持常驻']])}</div><p class="fieldhint">按需加载可给语音识别留出内存；常驻可以减少再次加载的等待。</p>`;
if(config.mode==='cloud')body=`<div class="row"><div>Provider</div><span class="pill">自定义 · OpenAI 兼容</span></div>${field('模型服务地址','cloudURL',config.cloudURL)}${field('模型 ID','cloudModel',config.cloudModel,'填写 Provider 的模型 ID')}<label class="field"><span>API Key</span><input type="password" disabled placeholder="原型不接收密钥；正式配置存入 Mac 钥匙串"></label><p class="fieldhint">只向所选服务发送用于整理的文字和选定历史；不发送原始音频。</p><div class="buttonrow"><button data-action="test-model">测试连接</button></div>`;
if(config.mode==='quenda')body=`<div class="notice compact">为 24R 使用专属 Agent，按事件关联相关历史。Provider 可以沿用该 Agent 的配置，也可以为专属 Agent 选择。</div>${field('24R 的 Quenda Agent','agent',config.agent,'填写专属 Agent ID')}<div class="row"><div>Provider 与模型</div>${options('provider',[['inherit','跟随 Agent 配置'],['local','Ollama · 示例'],['cloud','云端 Provider · 示例']])}</div>${config.provider!=='inherit'?field('Agent 使用的模型','agentModel',config.agentModel,'选择此 Provider 中的模型'):''}<div class="buttonrow"><button data-action="quenda-manage">在 Quenda 中管理</button><button data-action="test-model">检查 Agent</button></div><p class="fieldhint">Gateway 使用 Companion 已配置的连接。修改专属 Agent 配置会影响它后续的运行。</p>`;
return `<section class="settings-section"><div class="sectionhead">智能整理 <span class="eyebrow">ANALYSIS</span></div><div class="modes">${[['local','本地 Ollama'],['cloud','云端模型'],['quenda','Quenda Agent']].map(([v,n])=>`<button data-mode="${v}" class="${config.mode===v?'active':''}">${n}</button>`).join('')}</div>${body}<div class="row"><div>关联历史<small>${config.mode==='quenda'?'24R 日报＋所选 Quenda 项目':'24R 自己的历史日报与未完成事项'}</small></div><button class="toggle ${config.history?'':'off'}" data-action="history-toggle" aria-label="${config.history?'关闭':'开启'}关联历史"></button></div>${config.history?`<div class="row"><div>回看范围</div>${options('days',[['7','最近 7 天'],['30','最近 30 天'],['90','最近 90 天']])}</div>${config.mode==='quenda'?`<div class="row"><div>可关联项目</div>${options('scope',[['24r','仅 24R 项目'],['speech','24R＋语音识别项目']])}</div>`:''}<p class="fieldhint">每条关联结论注明日期和来源，可回到原记录核对。</p>`:''}</section>`}
function settings(){return `<div class="eyebrow">MAKE IT YOURS</div><h1 class="title serif">按你的节奏。</h1><div class="sub">模型与 Agent 在 Mac 运行 · 两端共用 24R 配置</div><section class="settings-section"><div class="sectionhead">音频保留 <span class="pill">默认不保存</span></div><p class="fieldhint">日常音频仅用于即时转写，处理后释放。只有手动操作或匹配你设定的短语时，才开始保存音频。</p><div class="row"><div>关键词触发<small>仅匹配明确短语；不自动判断突发事件</small></div><button class="toggle ${keywordEnabled?'':'off'}" data-action="keyword-toggle" aria-label="${keywordEnabled?'关闭':'开启'}关键词触发"></button></div>${keywordEnabled?`${field('触发短语（用分号分隔）','phrases',config.phrases)}<p class="fieldhint">仅保存命中之后的声音，不回溯之前的对话。关键词触发依赖设备识别可用，离线时可手动保留。</p><div class="buttonrow"><button data-action="keyword-demo">模拟命中触发短语</button></div>`:''}<div class="row"><div>单次保留上限<small>可提前停止；暂停记录也会结束保存</small></div>${options('minutes',[['1','1 分钟'],['5','5 分钟'],['15','15 分钟']])}</div><div class="row"><div>已保留音频<small>仅在 iPhone 保存，主动导出或删除</small></div><button class="pill" data-action="clips">${savedClips.length} 个片段</button></div></section>${modelSettings()}<section class="settings-section"><div class="sectionhead">整理与保存</div><div class="row"><div>整理频率</div><span class="pill">每 1 小时</span></div><div class="row"><div>晚间日报</div><input aria-label="日报生成时间" type="time" value="${reportTime}" id="reporttime"></div><div class="row"><div>文字与日报<small>Mac 与 iPhone 各保存一份</small></div><span class="pill">双端保存</span></div><div class="row"><div>设备连接<small>${online?'Mac 已连接':'转写暂停；离线音频不补传'}</small></div><button class="pill" data-action="connection">${online?'模拟离线':'恢复连接'}</button></div></section><button class="primary" data-action="save-settings">保存设置</button><div class="notice">交互原型 · 设置只在当前页面演示，不实际连接模型、不调用 Agent、不录制或保存音频。</div>`}

function clips(){return `<button class="back" data-page="settings">${icon('back')} 返回设置</button><div class="eyebrow" style="margin-top:24px">SAVED BY YOU</div><h1 class="title serif">只留下需要的声音。</h1><div class="sub">主动保留片段 · 仅存于 iPhone</div>${savedClips.length?savedClips.map((c,i)=>`<div class="historyday" style="margin-top:20px"><div class="eyebrow">今天 · 片段 ${i+1}</div><h3>${esc(c.reason)}触发的记录</h3><p>${c.seconds} 秒 · 从触发后开始 · 未上传云端模型</p><div class="buttonrow"><button data-action="play-clip">播放片段</button><button data-action="play-clip">导出</button><button data-deleteclip="${i}">删除片段 ${i+1}</button></div></div>`).join(''):'<div class="notice">还没有保留的片段。日常转写不会生成音频文件；需要时在首页点“保留音频”。</div>'}<div class="notice">演示列表，不包含真实录音。转写文字和日报的保存独立于音频。</div>`}
function hour(){const e=events[detail];return `<button class="back" data-action="back">${icon('back')} 返回今天</button><div class="eyebrow" style="margin-top:28px">HOURLY NOTE / ${e[0]}</div><h1 class="title serif">${e[1]}</h1><div class="sub">已整理 · 10 月 4 日</div><div class="paper" style="margin-top:25px"><h3>这一小时的重点</h3><p>${e[2]}</p></div><div class="sectionhead">从对话中提取</div>${tasks()}<div class="sectionhead">转写文字</div><div class="quote serif">${["“可以每一个小时整理一次，然后定个晚上的时间出报告，电脑和手机端都保存一份。”","“同样用 C++ 推理，换成 FP16，用同一段中英混说录音比较。”","“先把语音识别的体验做好，再开始设计 24R 的界面。”"][detail]}</div><div class="notice">此时段未保留音频。可通过带时间的转写文字核对摘要与待办。</div>`}
function render(){document.querySelector('.board').classList.toggle('desktop',device==='mac');document.querySelectorAll('[data-device]').forEach(b=>b.classList.toggle('active',b.dataset.device===device));document.querySelector('#brief').innerHTML=`<div class="number">0${['A','B','C'].indexOf(variant)+1}</div><h2>记录在当下，<br>理解有来处。</h2><p>已选定时间线首页＋行动日报。默认只保留文字；按需保存音频，用本地模型或 Quenda Agent 整理并关联历史。</p><div class="tags">确定方案 / 音频按需保留 · 分析来源可选</div><p style="font-size:11px;margin-top:22px">示例数据 · 不实际录音<br>可试：暂停、小时记录、日报待办、生成报告、时间设置与离线状态。</p>`;const f=document.querySelector('#frame');f.className=`frame ${variant} ${device==='mac'?'mac':''}`;f.innerHTML=`<div class="island"></div><div class="status"><span>15:32</span><span>▂▄▆ ▰</span></div><aside class="rail"><div class="dots"><i></i><i></i><i></i></div><h3>◒ Companion</h3><small>你的应用</small><button data-action="companion">${icon('app')} Quenda</button><button data-action="companion">${icon('mic')} Whisper Anywhere</button><button class="selected" data-page="today">${icon('today')} 24R</button><small>24R</small>${[['today','今天'],['report','日报'],['history','历史'],['settings','设置']].map(([p,n])=>`<button data-page="${p}" class="${page===p?'selected':''}">${icon(p)}${n}</button>`).join('')}<div class="foot">● ${online?'iPhone 已连接':'等待 iPhone 连接'}<br>本地设备 · 连接由 Companion 管理</div></aside><div class="topbar"><button class="back" data-action="companion">${icon('back')} Companion</button><div class="brand">24<em>R</em></div>${savingAudio?`<button class="retentionbadge" data-action="stop-audio">● 保留中 · 停止</button>`:''}<button class="iconbutton" data-page="settings" aria-label="打开设置">${icon('settings')}</button></div><div class="content">${detail!==false?hour():({today,report,history:historyPage,settings,clips}[page])()}</div><aside class="insight"><div class="eyebrow" style="margin-bottom:14px">DEVICE & DAILY FLOW</div><h3>记录在手机，整理在电脑。</h3><div class="statusline">${icon('phone')} iPhone · ${recording?'记录中':'已暂停'}</div><div class="statusline">${icon('computer')} Mac · ${online?'已连接':'离线'}</div><p>${online?'文字与日报保存在两端，原始音频默认不保存。':'转写暂停；离线音频不补传。手动保留的片段独立保存。'}</p><div class="paper" style="margin-top:28px"><h3>今天的节奏</h3><p>每小时整理一次<br>下一次 · 16:00<br>晚间日报 · ${reportTime}</p></div><div class="paper" style="margin-top:22px"><h3>智能整理</h3><p>${esc(analysisLabel())}<br>${config.history?"关联所选历史 · 附来源":"仅分析当天文字"}</p></div><div class="paper" style="margin-top:22px"><h3>下一步</h3><p>完成 24R 首页设计<br>比较中英混说识别效果<br>确认音频保留触发短语</p></div><button class="primary" data-page="report">查看今日总结 ${icon('arrow')}</button></aside><nav class="tabs" aria-label="24R 页面导航">${[['today','今天'],['report','日报'],['history','历史'],['settings','设置']].map(([p,n])=>`<button data-page="${p}" class="${page===p?'active':''}">${icon(p)}${n}</button>`).join('')}</nav><div class="homeindicator"></div>`;document.querySelector('#variantlabel').textContent="设计已选定 · 时间线＋行动日报";document.querySelector('#state').textContent=`原型状态 · ${device==='phone'?'iPhone':'Mac'} · ${recording?'记录中':'已暂停'} · ${savingAudio?'主动保留音频':'音频不保存'} · ${online?'已连接':'离线'} · ${reportReady?'日报已生成':'阶段总结'} · 日报 ${reportTime} · 已完成 ${checked.size}/3`;const u=new URL(location.href);u.searchParams.delete('variant');u.searchParams.set('page',page);u.searchParams.set('device',device);window.history.replaceState(null,'',u)}
function toast(text){clearTimeout(toastTimer);document.querySelector('.toast')?.remove();document.querySelector('#frame').insertAdjacentHTML('beforeend',`<div class="toast" role="status">${esc(text)}</div>`);toastTimer=setTimeout(()=>document.querySelector('.toast')?.remove(),3500)}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-page],[data-detail]');if(!b)return;if(b.dataset.deleteclip!==undefined){savedClips.splice(Number(b.dataset.deleteclip),1);render();return}if(b.dataset.mode){config.mode=b.dataset.mode;render();return}if(b.dataset.device){device=b.dataset.device;render()}else if(b.dataset.page){page=b.dataset.page;detail=false;render()}else if(b.dataset.detail!==undefined){detail=Number(b.dataset.detail);render()}else if(b.dataset.task!==undefined){const i=Number(b.dataset.task);checked.has(i)?checked.delete(i):checked.add(i);render()}else if(b.dataset.history!==undefined){page='report';reportReady=b.dataset.history!=='0';detail=false;render();if(b.dataset.history!=='0')toast('原型演示：历史日报复用示例内容')}else if(b.dataset.action){switch(b.dataset.action){case'record':recording=!recording;if(!recording)stopAudio();render();break;case'stop-audio':stopAudio();render();break;case'keep-audio':if(savingAudio){stopAudio();render()}else startAudio('手动');break;case'keyword-toggle':keywordEnabled=!keywordEnabled;render();break;case'keyword-demo':if(!config.phrases.trim()){toast('请先填写触发短语。');break}if(!online){toast('设备识别不可用时，仍可在首页手动保留音频（演示）');break}startAudio('关键词');toast('已模拟命中：'+config.phrases.split(/[；;]/)[0]);break;case'history-toggle':config.history=!config.history;render();break;case'clips':page='clips';detail=false;render();break;case'play-clip':toast('这是演示片段，没有真实音频可播放或导出。');break;case'list-models':toast('正式版从此 Mac 可访问的 Ollama 服务读取模型列表；原型不发起连接。');break;case'test-model':toast('原型仅展示连接流程，未实际连接模型或 Agent。');break;case'quenda-manage':toast('正式版打开 Quenda 的 Agent / Provider 设置；专属 Agent 示例：24r-agent。');break;case'history-source':toast('示例来源：10 月 3 日 · 24R 项目 · 全天记录讨论；正式版可定位原会话。');break;case'save-settings':toast('设置已用于本次演示；刷新后恢复默认，不写入真实配置。');break;case'connection':online=!online;render();break;case'generate':if(!online){toast('日报等待 Mac 生成，连接恢复后会继续处理（演示）');break}reportReady=true;render();toast('日报已生成，已保存到 iPhone 与 Mac（演示）');break;case'back':detail=false;page='today';render();break;case'source':toast('原型中没有真实录音；正式版本将定位到对应音频片段。');break;case'companion':toast('Companion 的第三个应用：24R。其余应用入口仅作界面参照。');break;case'syncsetting':toast('按当前设计，日报和文字默认在电脑与手机各保存一份。');break;}}});
document.addEventListener('input',e=>{if(e.target.dataset.config)config[e.target.dataset.config]=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='reporttime'){reportTime=e.target.value||'21:30';render()}if(e.target.dataset.config){config[e.target.dataset.config]=e.target.value;if(e.target.tagName==='SELECT')render()}});render();
</script></body></html>
