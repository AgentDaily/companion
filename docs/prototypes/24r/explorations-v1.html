<header class="studio"><div><small>COMPANION · APP 03 · UI PROTOTYPE</small><h1>24R / 留住一天，理清下一步。</h1></div><div class="device"><button data-device="phone">iPhone</button><button data-device="mac">Mac</button></div></header>
<div class="board"><aside class="brief" id="brief"></aside><main class="frame" id="frame" aria-label="24R 应用预览"></main></div>
<div class="switcher"><button id="prev" aria-label="上一个设计方向">←</button><span id="variantlabel"></span><button id="next" aria-label="下一个设计方向">→</button></div><div class="state" id="state"></div>
<script>
const paths={back:'m12 5-7 7 7 7',pause:'M8 5v14M16 5v14',play:'m8 5 11 7-11 7Z',today:'M4 9h16v11H4ZM8 3v4m8-4v4M4 5h16v4H4',report:'M6 3h8l4 4v14H6ZM9 11h6m-6 4h6',history:'M3 11a9 9 0 1 1 2 7M3 4v7h7m2-4v6l4 2',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2',sync:'m4 8 3-3h11m2 11-3 3H6M4 4v4h4m12 12v-4h-4',arrow:'M5 12h14m-5-5 5 5-5 5',mic:'M9 5a3 3 0 0 1 6 0v7a3 3 0 0 1-6 0ZM5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8',check:'m5 12 4 4L19 6',computer:'M3 4h18v13H3Zm9 13v4m-5 0h10',phone:'M7 2h10v20H7Zm4 17h2',app:'M4 4h6v6H4Zm10 0h6v6h-6ZM4 14h6v6H4Zm10 0h6v6h-6'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.report}"/></svg>`;
const names={A:'日记 · 时间线',B:'录音 · 控制台',C:'日报 · 行动优先'},briefs={A:['记录在进行，<br>生活在前面。','安静的全天记录。以小时为单位回看，录音状态始终可见，晚上再把一天整理成清楚的下一步。','建议方向 / 日常使用 · 低干扰'],B:['一眼确认，<br>没有错过。','强调正在录音、已记录时长与整理进度。适合你需要明确掌握采集状态、连接和处理情况的场景。','状态优先 / 采集 · 可控'],C:['一天的声音，<br>变成行动。','把总结、待办与对策放到最前面。录音缩成轻量状态条，主要用于晚间复盘和第二天的行动。','结果优先 / 复盘 · 执行']};
const url=new URL(location.href);let variant=['A','B','C'].includes(url.searchParams.get('variant'))?url.searchParams.get('variant'):'A',device=url.searchParams.get('device')==='mac'?'mac':'phone',page='today',recording=true,online=true,reportReady=false,reportTime='21:30',checked=new Set(),detail=false,toastTimer;
const events=[['14:00—15:00','把全天记录拆成每小时整理','确定手机负责录音，电脑处理转写与整理，晚间生成一天的总结。',['2 项待办','1 个决定']],['13:00—14:00','中英文语音识别对比','对比官方 Q8 与 FP16；保留快速切换，用同一段录音检查识别效果。',['研究记录']],['11:00—12:00','梳理今天的工作重点','先完成语音识别体验，再设计 24R 的记录与日报界面。',['工作计划']]];
const capture=()=>`<div class="capture"><i class="live ${recording?'':'paused'}"></i><div><strong>${recording?'正在记录你的一天':'记录已暂停'}</strong><small>${recording?'iPhone 麦克风 · 已持续 04:32:18':'暂停期间不会采集声音'}</small></div><button data-action="record" aria-label="${recording?'暂停录音':'继续录音'}">${icon(recording?'pause':'play')}</button></div>`;
const sync=()=>`<div class="sync">${icon('sync')}${online?'iPhone 与 Mac 均已保存 · 刚刚同步':'离线 · 录音保存在 iPhone，连接后继续同步'}</div>`;
const teaser=()=>`<div class="reporttease" data-page="report"><div class="eyebrow">YOUR DAILY BRIEF</div><h3>${reportReady?'今天的日报已就绪':`今晚 ${reportTime}，一天会更清楚。`}</h3><div class="sub">${reportReady?'查看一日总结、待办与行动建议':'一日总结 · 待办 · 对策'}</div><span class="arrow">${icon('arrow')}</span></div>`;
const timeline=()=>`<div class="sectionhead">每小时整理 <button data-page="history">查看全部 ↗</button></div><div class="timeline"><div class="event"><span class="time">15:00—16:00 · ${recording?(online?'记录中':'离线记录中'):'已暂停'}</span><h3>这一小时还在发生</h3><p>${!recording?'录音已暂停，已有内容仍会按时整理。':online?'16:00 自动整理，完成后会出现在这里。':'手机继续保存录音；Mac 连接后补充转写与整理。'}</p></div>${events.map((e,i)=>`<div class="event" data-detail="${i}"><span class="time">${e[0]} · 已整理</span><h3>${e[1]}</h3><p>${e[2]}</p><div class="chips">${e[3].map(c=>`<span class="chip">${c}</span>`).join('')}</div></div>`).join('')}</div>`;
const tasks=()=>[['完成 24R 首页设计','今天 · 来自 14:00 的记录'],['用中英混说录音对比 Q8 与 FP16','明天 · 来自 13:00 的记录'],['确定全天录音的音频保留周期','待确认 · 来自 14:00 的记录']].map((t,i)=>`<div class="task ${checked.has(i)?'done':''}"><button data-task="${i}" aria-label="${checked.has(i)?'标记为未完成：':'标记为完成：'}${t[0]}">${checked.has(i)?icon('check'):''}</button><div><span>${t[0]}</span><small>${t[1]}</small></div></div>`).join('');
function today(){if(variant==='A')return `<div class="eyebrow">SUNDAY, OCTOBER 04</div><h1 class="title serif">今天，慢慢记下来。</h1><div class="sub">2026 年 10 月 4 日 · 星期日</div>${capture()}<div class="stats"><div><strong>4<span style="font-size:13px">h</span> 32<span style="font-size:13px">m</span></strong><small>今日记录</small></div><div><strong>4</strong><small>小时已整理</small></div><div><strong>3</strong><small>待办已提取</small></div></div>${teaser()}${timeline()}${sync()}`;
if(variant==='B')return `<div class="eyebrow">OCT 04 · SUNDAY</div><div class="recordhero"><span class="pill">${recording?'● 正在录音':'记录已暂停'}</span><div class="clock">04:32:18</div><div class="sub">今天已经留住的时间</div><div class="waves ${recording?'':'pausedwaves'}">${Array.from({length:43},(_,i)=>`<i style="height:${8+Math.abs(Math.sin(i*1.6))*48}px;--delay:${i%7*.12}s"></i>`).join('')}</div><button class="bigcontrol" data-action="record" aria-label="${recording?'暂停录音':'继续录音'}">${icon(recording?'pause':'play')}</button><div class="sub" style="margin-top:22px">${recording?'暂停记录，给自己一点安静':'随时继续，接着记录这一刻'}</div></div><div class="stats"><div><strong>4</strong><small>已整理小时</small></div><div><strong>3</strong><small>待办事项</small></div><div><strong>16:00</strong><small>下一次整理</small></div></div><div class="processing"><b>${online?'● 电脑正在接收这一小时':'○ 手机离线保存中'}</b><br><span class="sub">${online?'iPhone 采集 → Mac 转写 → 每小时整理':'连接恢复后会继续上传并补充整理'}</span></div><div style="margin-top:20px">${teaser()}</div>${sync()}`;
return `<div class="compactcapture"><i class="live ${recording?'':'paused'}"></i>${recording?'录音中 · 4h 32m':'记录已暂停'}<button data-action="record">${recording?'暂停':'继续'} ${icon(recording?'pause':'play')}</button></div><div class="editorial"><div class="eyebrow">TODAY / 04 OCTOBER</div><h1 class="title serif">把记录，<br>变成下一步。</h1><p>今天围绕语音识别和全天记录展开。模型对比已完成，下一步是把记录、整理和复盘连接起来。</p></div><div class="reportmeta"><span>今日阶段总结 · 更新至 15:00</span><span>4 个小时已整理</span></div><div class="sectionhead">接下来做什么 <span class="pill">${3-checked.size} 项</span></div>${tasks()}<div class="strategy"><b>一个值得尝试的对策</b>先用相同录音比较两种精度，再决定默认模型。暂时不以权重精度推断识别效果。<div class="chips"><span class="chip">来自 13:00 的记录</span><span class="chip">建议，待确认</span></div></div>${teaser()}${sync()}`}
function report(){return `<div class="eyebrow">DAILY BRIEF / 04 OCTOBER</div><h1 class="title serif">今天，留下了什么。</h1><div class="sub">${reportReady?'今日最终日报 · 已保存到两端':`当前为阶段总结 · ${reportTime} 生成最终日报`}</div><div class="paper" style="margin-top:25px"><h3>一日总结</h3><p>今天主要推进了语音识别与全天记录助手。官方 C++ 流式识别已能稳定出字，完成 Q8 与 FP16 对照；24R 的重点转向每小时整理、晚间复盘和双端保存。</p><div class="chips"><span class="chip">4 个小时的记录</span><span class="chip">3 个待办</span><span class="chip">1 个建议</span></div></div><div class="sectionhead">待办事项 <span class="pill">${3-checked.size} 项待完成</span></div>${tasks()}<div class="sectionhead">对策与建议</div><div class="strategy"><b>用实际录音，决定默认精度</b>保留 Q8 与 FP16 切换。用同一段中英混说录音比较识别错误，再判断是否值得增加内存和处理时间。<div class="chips"><span class="chip">建议，待确认</span><button class="chip" data-detail="1">查看来源 ↗</button></div></div><button class="primary" data-action="generate">${icon('report')}${reportReady?'重新生成日报':'现在生成最终日报'}</button>${sync()}`}
function historyPage(){return `<div class="eyebrow">YOUR DAYS</div><h1 class="title serif">每一天，都有迹可循。</h1><div class="sub" style="margin-bottom:25px">日报与小时记录 · 两端均可查看</div>${['10 月 4 日 · 今天','10 月 3 日 · 星期六','10 月 2 日 · 星期五'].map((d,i)=>`<button class="historyday" data-history="${i}"><div class="eyebrow">${d}</div><h3>${['从语音识别，走向全天记录','留出时间，完成一件重要的事','把想法整理成可以开始的计划'][i]}</h3><p>${i?'最终日报 · 7 小时记录 · 4 项待办':'今日进行中 · 4 小时已整理 · 3 项待办'}</p><div class="chips"><span class="chip">iPhone 已保存</span><span class="chip">Mac 已保存</span></div></button>`).join('')}`}
function settings(){return `<div class="eyebrow">MAKE IT YOURS</div><h1 class="title serif">按你的节奏。</h1><div class="sub">24R 应用设置 · 连接由 Companion 管理</div><div class="row"><div>整理频率<small>录音转写后，按小时汇总</small></div><span class="pill">每 1 小时</span></div><div class="row"><div>晚间日报<small>最终总结、待办与对策</small></div><input aria-label="日报生成时间" type="time" value="${reportTime}" id="reporttime"></div><div class="row"><div>保存到两端<small>Mac 与 iPhone 各保留一份</small></div><button class="toggle" data-action="syncsetting" aria-label="双端保存已启用"></button></div><div class="row"><div>原始音频保留<small>转写文字与日报长期保存</small></div><select aria-label="原始音频保留周期"><option>7 天</option><option>1 天</option><option>30 天</option><option>手动删除</option></select></div><div class="row"><div>设备连接<small>${online?'已连接你的 Mac':'断开连接后，手机先本地保存'}</small></div><button class="pill" data-action="connection">${online?'模拟离线':'恢复连接'}</button></div><div class="notice">录音始终有明确状态，也可以随时暂停。断开连接时，手机继续保存录音，重新连接后补充转写与整理。<br><br>这些是拟议的使用流程；当前原型使用示例数据，不实际录音或同步。</div>`}
function hour(){const e=events[detail];return `<button class="back" data-action="back">${icon('back')} 返回今天</button><div class="eyebrow" style="margin-top:28px">HOURLY NOTE / ${e[0]}</div><h1 class="title serif">${e[1]}</h1><div class="sub">已整理 · 10 月 4 日</div><div class="paper" style="margin-top:25px"><h3>这一小时的重点</h3><p>${e[2]}</p></div><div class="sectionhead">从对话中提取</div>${tasks()}<div class="sectionhead">转写文字</div><div class="quote serif">${["“可以每一个小时整理一次，然后定个晚上的时间出报告，电脑和手机端都保存一份。”","“同样用 C++ 推理，换成 FP16，用同一段中英混说录音比较。”","“先把语音识别的体验做好，再开始设计 24R 的界面。”"][detail]}</div><button class="primary" data-action="source">${icon('play')} 播放原始录音</button><div class="sub">摘要和待办都可回到原始记录核对。</div>`}
function render(){document.querySelector('.board').classList.toggle('desktop',device==='mac');document.querySelectorAll('[data-device]').forEach(b=>b.classList.toggle('active',b.dataset.device===device));document.querySelector('#brief').innerHTML=`<div class="number">0${['A','B','C'].indexOf(variant)+1}</div><h2>${briefs[variant][0]}</h2><p>${briefs[variant][1]}</p><div class="tags">${briefs[variant][2]}</div><p style="font-size:11px;margin-top:22px">示例数据 · 不实际录音<br>可试：暂停、小时记录、日报待办、生成报告、时间设置与离线状态。</p>`;const f=document.querySelector('#frame');f.className=`frame ${variant} ${device==='mac'?'mac':''}`;f.innerHTML=`<div class="island"></div><div class="status"><span>15:32</span><span>▂▄▆ ▰</span></div><aside class="rail"><div class="dots"><i></i><i></i><i></i></div><h3>◒ Companion</h3><small>你的应用</small><button data-action="companion">${icon('app')} Quenda</button><button data-action="companion">${icon('mic')} Whisper Anywhere</button><button class="selected" data-page="today">${icon('today')} 24R</button><small>24R</small>${[['today','今天'],['report','日报'],['history','历史'],['settings','设置']].map(([p,n])=>`<button data-page="${p}" class="${page===p?'selected':''}">${icon(p)}${n}</button>`).join('')}<div class="foot">● ${online?'iPhone 已连接':'等待 iPhone 连接'}<br>本地设备 · 连接由 Companion 管理</div></aside><div class="topbar"><button class="back" data-action="companion">${icon('back')} Companion</button><div class="brand">24<em>R</em></div><button class="iconbutton" data-page="settings" aria-label="打开设置">${icon('settings')}</button></div><div class="content">${detail!==false?hour():({today,report,history:historyPage,settings}[page])()}</div><aside class="insight"><div class="eyebrow" style="margin-bottom:14px">DEVICE & DAILY FLOW</div><h3>记录在手机，整理在电脑。</h3><div class="statusline">${icon('phone')} iPhone · ${recording?'记录中':'已暂停'}</div><div class="statusline">${icon('computer')} Mac · ${online?'已连接':'离线'}</div><p>${online?'录音与日报均已保存到两端。':'手机保留录音，连接后继续上传和整理。'}</p><div class="paper" style="margin-top:28px"><h3>今天的节奏</h3><p>每小时整理一次<br>下一次 · 16:00<br>晚间日报 · ${reportTime}</p></div><div class="paper" style="margin-top:22px"><h3>下一步</h3><p>完成 24R 首页设计<br>比较中英混说识别效果<br>确定录音保留周期</p></div><button class="primary" data-page="report">查看今日总结 ${icon('arrow')}</button></aside><nav class="tabs" aria-label="24R 页面导航">${[['today','今天'],['report','日报'],['history','历史'],['settings','设置']].map(([p,n])=>`<button data-page="${p}" class="${page===p?'active':''}">${icon(p)}${n}</button>`).join('')}</nav><div class="homeindicator"></div>`;document.querySelector('#variantlabel').textContent=`${variant} — ${names[variant]}`;document.querySelector('#state').textContent=`原型状态 · ${device==='phone'?'iPhone':'Mac'} · ${recording?'记录中':'已暂停'} · ${online?'已连接':'离线'} · ${reportReady?'日报已生成':'阶段总结'} · 日报 ${reportTime} · 已完成 ${checked.size}/3`;const u=new URL(location.href);u.searchParams.set('variant',variant);u.searchParams.set('device',device);window.history.replaceState(null,'',u)}
function toast(text){clearTimeout(toastTimer);document.querySelector('.toast')?.remove();document.querySelector('#frame').insertAdjacentHTML('beforeend',`<div class="toast" role="status">${text}</div>`);toastTimer=setTimeout(()=>document.querySelector('.toast')?.remove(),3500)}
function cycle(step){variant=['A','B','C'][(['A','B','C'].indexOf(variant)+step+3)%3];detail=false;render()}
document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-page],[data-detail]');if(!b)return;if(b.dataset.device){device=b.dataset.device;render()}else if(b.dataset.page){page=b.dataset.page;detail=false;render()}else if(b.dataset.detail!==undefined){detail=Number(b.dataset.detail);render()}else if(b.dataset.task!==undefined){const i=Number(b.dataset.task);checked.has(i)?checked.delete(i):checked.add(i);render()}else if(b.dataset.history!==undefined){page='report';reportReady=b.dataset.history!=='0';detail=false;render();if(b.dataset.history!=='0')toast('原型演示：历史日报复用示例内容')}else if(b.dataset.action){switch(b.dataset.action){case'record':recording=!recording;render();break;case'connection':online=!online;render();break;case'generate':if(!online){toast('日报等待 Mac 生成，连接恢复后会继续处理（演示）');break}reportReady=true;render();toast('日报已生成，已保存到 iPhone 与 Mac（演示）');break;case'back':detail=false;page='today';render();break;case'source':toast('原型中没有真实录音；正式版本将定位到对应音频片段。');break;case'companion':toast('Companion 的第三个应用：24R。其余应用入口仅作界面参照。');break;case'syncsetting':toast('按当前设计，日报和文字默认在电脑与手机各保存一份。');break;}}});
document.addEventListener('change',e=>{if(e.target.id==='reporttime'){reportTime=e.target.value||'21:30';render();toast(`晚间日报时间已设为 ${reportTime}（演示）`)}});document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1)}});render();
</script></body></html>
